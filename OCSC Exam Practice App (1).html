                    return [];

            // --- EXAM ACTION HANDLERS ---
            selectAnswer(questionId, choiceIndex) {

                this.renderExamInterface();

            toggleFlag(questionId) {
                if (this.flaggedQuestions.has(questionId)) {
                    this.flaggedQuestions.delete(questionId);
                } else {
                    this.flaggedQuestions.add(questionId);
                }
                this.renderExamInterface();
            }

            jumpToQuestion(index) {
                if (index >= 0 && index < this.activeQuestions.length) {
                    this.currentIndex = index;
                    this.renderExamInterface();
                }
            }

            prevQuestion() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.renderExamInterface();
                }
            }

            nextQuestion() {
                if (this.currentIndex < this.activeQuestions.length - 1) {
                    this.currentIndex++;
                    this.renderExamInterface();
                }
            }

            attachGlobalKeyboardListeners() {
                document.addEventListener('keydown', (e) => {
                    if (this.currentMode !== 'exam') return;

                    // Number keys 1-4
                    if (['1', '2', '3', '4'].includes(e.key)) {
                        const q = this.activeQuestions[this.currentIndex];
                        const idx = parseInt(e.key) - 1;
                        this.selectAnswer(q.id, idx);
                    }
                    // Arrow Left
                    else if (e.key === 'ArrowLeft') {
                        this.prevQuestion();
                    }
                    // Arrow Right
                    else if (e.key === 'ArrowRight') {
                        this.nextQuestion();
                    }
                    // 'f' or 'F' for flag
                    else if (e.key.toLowerCase() === 'f') {
                        const q = this.activeQuestions[this.currentIndex];
                        this.toggleFlag(q.id);
                    }
                });
            }

                                    กลับไปทำต่อ
                                </button>
                                <button onclick="app.submitExam()" class="w-1/2 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700 shadow-md transition">
                                    ยืนยันส่งข้อสอบ
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- SUBMIT & EVALUATION LOGIC ---
            submitExam() {
                this.stopTimer();
                document.getElementById('modal-root').innerHTML = '';

                // Calculate scores per subject
                const subjectScores = { 1: 0, 2: 0, 3: 0 };
                const subjectTotals = { 1: 0, 2: 0, 3: 0 };

                this.activeQuestions.forEach(q => {
                    subjectTotals[q.subjectId]++;
                    if (this.userAnswers[q.id] === q.answer) {
                        subjectScores[q.subjectId]++;
                    }
                });

                // Evaluate Pass/Fail status per subject
                const subjectResults = {};
                let isPassedOverall = true;

                // If in practice mode, only evaluate the selected subject
                const relevantSubjects = this.examModeType === 'mock' ? [1, 2, 3] : [this.selectedSubjectId];

                relevantSubjects.forEach(sId => {
                    const score = subjectScores[sId];
                    const total = subjectTotals[sId];
                    const percent = total > 0 ? (score / total) * 100 : 0;
                    const required = OCSC_CRITERIA[sId].passPercent;
                    const isPassed = percent >= required;

                    subjectResults[sId] = {
                        score,
                        total,
                        percent,
                        required,
                        isPassed
                    };

                    if (!isPassed) {
                        isPassedOverall = false;
                    }
                });

                const totalScore = Object.values(subjectScores).reduce((a, b) => a + b, 0);
                const totalQuestions = this.activeQuestions.length;

                // Create record for history
                const resultRecord = {
                    date: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }),
                    modeType: this.examModeType,
                    modeName: this.examModeType === 'mock' ? 'จำลองสนามสอบจริง' : `ฝึกฝนวิชา ${OCSC_CRITERIA[this.selectedSubjectId].name}`,
                    totalScore,
                    totalQuestions,
                    isPassedOverall,
                    subjectResults
                };

                this.saveHistory(resultRecord);
                this.renderResultView(resultRecord);

                // Confetti if passed overall
                if (isPassedOverall && typeof confetti === 'function') {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            }

            // --- RESULT & REVIEW VIEW RENDERER ---
            renderResultView(record) {
                this.currentMode = 'result';
                const main = document.getElementById('main-content');

                main.innerHTML = `
                    <div class="space-y-8 max-w-4xl mx-auto">
                        <!-- OVERALL EVALUATION BANNER -->
                        <div class="rounded-3xl p-6 sm:p-8 text-center text-white shadow-xl relative overflow-hidden ${record.isPassedOverall ? 'bg-gradient-to-br from-emerald-600 via-teal-700 to-emerald-900' : 'bg-gradient-to-br from-rose-600 via-slate-800 to-slate-900'}">
                            <div class="relative z-10 space-y-3">
                                <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg ${record.isPassedOverall ? 'bg-emerald-400/20 text-emerald-200' : 'bg-rose-400/20 text-rose-200'}">
                                    <i class="fa-solid ${record.isPassedOverall ? 'fa-award' : 'fa-circle-xmark'}"></i>
                                </div>
                                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider ${record.isPassedOverall ? 'bg-emerald-400/20 text-emerald-100' : 'bg-rose-400/20 text-rose-100'}">
                                    ${record.modeName}
                                </span>
                                <h2 class="font-heading font-bold text-2xl sm:text-4xl">
                                    ${record.isPassedOverall ? 'ยินดีด้วย! คุณสอบผ่านเกณฑ์ ก.พ.' : 'ยังไม่ผ่านเกณฑ์การทดสอบ'}
                                </h2>
                                <p class="text-xs sm:text-sm text-slate-200 max-w-md mx-auto">
                                    ${record.isPassedOverall 
                                        ? 'คุณทำคะแนนผ่านเกณฑ์ขั้นต่ำตามที่สำนักงาน ก.พ. กำหนดครบถ้วนในทุกวิชา' 
                                        : 'การสอบผ่าน ก.พ. ภาค ก. จำเป็นต้องทำคะแนนผ่านเกณฑ์ขั้นต่ำครบทั้ง 3 วิชา สู้ต่อไปนะครับ!'}
                                </p>
                                <div class="pt-2 font-heading">
                                    <span class="text-3xl sm:text-5xl font-bold">${record.totalScore}</span>
                                    <span class="text-sm opacity-80"> / ${record.totalQuestions} คะแนน</span>
                                </div>
                            </div>
                        </div>

                        <!-- SUBJECT BREAKDOWN CARDS -->
                        <div class="space-y-4">
                            <h3 class="font-heading font-bold text-slate-900 text-lg flex items-center space-x-2">
                                <i class="fa-solid fa-chart-pie text-brand-600"></i>
                                <span>สรุปคะแนนแยกตามรายวิชา</span>
                            </h3>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                ${Object.keys(record.subjectResults).map(sId => {
                                    const res = record.subjectResults[sId];
                                    const crit = OCSC_CRITERIA[sId];
                                    return `
                                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                            <div class="flex items-center justify-between">
                                                <h4 class="font-heading font-bold text-sm text-slate-800">${crit.name}</h4>
                                                <span class="text-xs font-bold px-2 py-0.5 rounded-md ${res.isPassed ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                                    ${res.isPassed ? 'ผ่าน' : 'ไม่ผ่าน'}
                                                </span>
                                            </div>

                                            <div class="flex items-baseline justify-between text-xs text-slate-500">
                                                <span>คะแนนที่ได้: <strong class="text-slate-800 text-base font-heading">${res.score}/${res.total}</strong> (${Math.round(res.percent)}%)</span>
                                                <span>เกณฑ์ผ่าน: ${res.required}%</span>
                                            </div>

                                            <!-- PROGRESS BAR -->
                                            <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden relative">
                                                <div class="h-full rounded-full transition-all duration-500 ${res.isPassed ? 'bg-emerald-500' : 'bg-rose-500'}" style="width: ${res.percent}%"></div>
                                                <!-- THRESHOLD MARKER -->
                                                <div class="absolute top-0 bottom-0 w-0.5 bg-slate-400 z-10" style="left: ${res.required}%" title="เกณฑ์ผ่าน ${res.required}%"></div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- DETAILED REVIEW SECTION -->
                        <div class="space-y-4 pt-4 border-t border-slate-200">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <h3 class="font-heading font-bold text-slate-900 text-lg flex items-center space-x-2">
                                    <i class="fa-solid fa-list-check text-brand-600"></i>
                                    <span>ตรวจเฉลยคำตอบอย่างละเอียด</span>
                                </h3>

                                <!-- REVIEW FILTERS -->
                                <div class="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-medium space-x-1">
                                    <button onclick="app.setReviewFilter('all')" class="px-3 py-1.5 rounded-lg transition ${this.reviewFilter === 'all' ? 'bg-white text-brand-600 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                        ทั้งหมด
                                    </button>
                                    <button onclick="app.setReviewFilter('wrong')" class="px-3 py-1.5 rounded-lg transition ${this.reviewFilter === 'wrong' ? 'bg-white text-rose-600 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                        เฉพาะข้อที่ผิด
                                    </button>
                                    <button onclick="app.setReviewFilter('flagged')" class="px-3 py-1.5 rounded-lg transition ${this.reviewFilter === 'flagged' ? 'bg-white text-amber-600 font-bold shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                        เฉพาะที่ติด Flag
                                    </button>
                                </div>
                            </div>

                            <!-- REVIEW LIST CARDS -->
                            <div class="space-y-6">
                                ${this.renderReviewItemsHTML()}
                            </div>
                        </div>

                        <!-- BOTTOM ACTION BUTTONS -->
                        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-6 border-t border-slate-200">
                            <button onclick="app.showHome()" class="w-full sm:w-auto px-6 py-3 rounded-xl border border-slate-300 font-heading font-semibold text-slate-700 hover:bg-slate-100 transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-house"></i>
                                <span>กลับหน้าหลัก</span>
                            </button>
                            <button onclick="app.retryCurrentMode()" class="w-full sm:w-auto px-8 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-heading font-semibold shadow-md transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>ทำข้อสอบใหม่อีกครั้ง</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            setReviewFilter(filterType) {
                this.reviewFilter = filterType;
                const record = this.getHistory()[0];
                if (record) {
                    this.renderResultView(record);
                }
            }

            renderReviewItemsHTML() {
                const filtered = this.activeQuestions.filter((q) => {
                    const userChoice = this.userAnswers[q.id];
                    const isCorrect = userChoice === q.answer;
                    const isFlagged = this.flaggedQuestions.has(q.id);

                    if (this.reviewFilter === 'wrong') return !isCorrect;
                    if (this.reviewFilter === 'flagged') return isFlagged;
                    return true;
                });

                if (filtered.length === 0) {
                    return `
                        <div class="bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-200">
                            <i class="fa-solid fa-inbox text-4xl mb-2"></i>
                            <p class="text-sm font-medium">ไม่พบรายการข้อสอบตามเงื่อนไขการกรองนี้</p>
                        </div>
                    `;
                }

                return filtered.map((q) => {
                    const originalIndex = this.activeQuestions.findIndex(item => item.id === q.id);
                    const userChoice = this.userAnswers[q.id];
                    const isCorrect = userChoice === q.answer;
                    const isUnanswered = userChoice === undefined;
                    const choiceLetters = ['ก', 'ข', 'ค', 'ง'];

                    return `
                        <div class="bg-white rounded-2xl border ${isCorrect ? 'border-slate-200' : 'border-rose-200'} p-6 shadow-sm space-y-4">
                            <!-- HEADER -->
                            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                <div class="flex items-center space-x-2">
                                    <span class="w-6 h-6 rounded-md bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center font-heading">
                                        ${originalIndex + 1}
                                    </span>
                                    <span class="text-xs text-slate-500 font-medium">${q.subjectName} • ${q.topic}</span>
                                </div>

                                <div class="flex items-center space-x-2">
                                    ${this.flaggedQuestions.has(q.id) ? `<span class="bg-amber-100 text-amber-800 text-[11px] font-semibold px-2 py-0.5 rounded"><i class="fa-solid fa-flag mr-1"></i> Flagged</span>` : ''}
                                    ${isCorrect 
                                        ? `<span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-md"><i class="fa-solid fa-check mr-1"></i> ตอบถูกต้อง</span>` 
                                        : `<span class="bg-rose-100 text-rose-800 text-xs font-semibold px-2.5 py-1 rounded-md"><i class="fa-solid fa-xmark mr-1"></i> ตอบผิด</span>`}
                                </div>
                            </div>

                            <!-- QUESTION -->
                            <div class="text-sm sm:text-base font-medium text-slate-900 leading-relaxed">
                                ${q.question.replace(/\n/g, '<br>')}
                            </div>

                            <!-- CHOICES REVIEW -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                ${q.choices.map((cText, idx) => {
                                    let style = "bg-slate-50 border-slate-200 text-slate-700";
                                    if (idx === q.answer) {
                                        style = "bg-emerald-50 border-emerald-400 text-emerald-900 font-bold ring-1 ring-emerald-400";
                                    } else if (idx === userChoice && !isCorrect) {
                                        style = "bg-rose-50 border-rose-300 text-rose-900 font-bold line-through";
                                    }

                                    return `
                                        <div class="p-3 rounded-xl border flex items-start space-x-2 ${style}">
                                            <span class="font-bold">${choiceLetters[idx]}.</span>
                                            <span>${cText}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <!-- EXPLANATION BOX -->
                            <div class="bg-brand-50/70 border border-brand-100 rounded-xl p-4 text-xs leading-relaxed space-y-1">
                                <div class="font-heading font-bold text-brand-900 flex items-center space-x-1.5">
                                    <i class="fa-solid fa-lightbulb text-amber-500"></i>
                                    <span>คำอธิบายเฉลยอย่างละเอียด:</span>
                                </div>
                                <div class="text-slate-700 whitespace-pre-line pt-1">
                                    ${q.explanation}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            retryCurrentMode() {
                if (this.examModeType === 'mock') {
                    this.startMockExam();
                } else {
                    this.startPracticeExam(this.selectedSubjectId);
                }
            }

            resetStatsModal() {
                const history = this.getHistory();
                const modalRoot = document.getElementById('modal-root');
                modalRoot.innerHTML = `
                    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
                            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                <h3 class="font-heading font-bold text-lg text-slate-900">ประวัติการทดสอบทั้งหมด</h3>
                                <button onclick="document.getElementById('modal-root').innerHTML=''" class="text-slate-400 hover:text-slate-600">
                                    <i class="fa-solid fa-xmark text-lg"></i>
                                </button>
                            </div>
                            
                            <div class="flex-grow overflow-y-auto custom-scrollbar space-y-2 pr-1">
                                ${history.length === 0 ? `<p class="text-xs text-slate-400 text-center py-6">ยังไม่มีประวัติการทำข้อสอบ</p>` : ''}
                                ${history.map(h => `
                                    <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
                                        <div>
                                            <div class="font-bold text-slate-800 font-heading">${h.modeName}</div>
                                            <div class="text-[10px] text-slate-500">${h.date}</div>
                                        </div>
                                        <div class="text-right">
                                            <div class="font-bold text-slate-900">${h.totalScore} / ${h.totalQuestions} คะแนน</div>
                                            <span class="text-[10px] font-semibold ${h.isPassedOverall ? 'text-emerald-600' : 'text-rose-600'}">
                                                ${h.isPassedOverall ? 'ผ่านเกณฑ์' : 'ไม่ผ่าน'}
                                            </span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="pt-2 border-t border-slate-100 flex justify-end">
                                <button onclick="document.getElementById('modal-root').innerHTML=''" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700">
                                    ปิดหน้าต่าง
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize application when DOM is ready
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new OCSCApp();
            app.init();
        });
    </script>
</body>
</html>
